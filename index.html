<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Registration Form</title>
    <style>
        * { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background-color: #ffffff; width: 100%; max-width: 450px; padding: 30px; 
		border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .form-container h2 { text-align: center; margin-bottom: 24px; color: #333333; }
        .form-group { margin-bottom: 20px; } 
        .form-group label { display: block; margin-bottom: 8px; 
		color: #666666; font-size: 14px; font-weight: 600; }
        .form-control { width: 100%; padding: 12px; border-radius: 4px; font-size: 16px; 
		color: #333333; transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .form-control:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 5px rgba(74, 144, 226, 0.3); }
        .btn-submit { width: 100%; padding: 12px; background-color: #4a90e2; border-radius: 4px;
		color: #ffffff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease; margin-top: 10px; }
        .btn-submit:hover { background-color: #357abd; }
        .form-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #777777; }
        .form-footer a { color: #4a90e2; text-decoration: none; }
        .form-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create Account</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Enter Name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="haidar2897@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter Your Password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="Repeat your password" required>
            </div>
            <button type="submit" class="btn-submit">Register</button>
            <div class="form-footer">
                Already have an account? <a href="#">Log In</a> 
            </div>
        </form>
    </div>
</body>
</html>
