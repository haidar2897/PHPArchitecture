<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .dashboard { display: flex; height: 100vh; }
        
        /* The old "left frame" */
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; }
        
        /* The old "right main frame" */
        .main-content { flex: 1; padding: 30px; background: #f4f6f9; }
    </style>
</head>
<body>
    <div class="dashboard">
        <nav class="sidebar">
            <h3>Navigation</h3>
            <ul>
                <li><a href="?page=home" style="color: white;">Home</a></li>
                <li><a href="?page=profile" style="color: white;">Profile</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1>Welcome Content</h1>
            <p>This layout behaves like a frame window but is natively responsive.</p>
        </main>
    </div>
</body>
</html>
